<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Depth shot demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/depthshot.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .plate { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!-- One depth shot: a slow push (dolly, not zoom) with a slight truck and roll, flowing water,
         energy pulses on the far tethers, and a craft sprite crossing the sky through the same camera. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080" data-fps="30">
      <div id="shot1" class="clip shot" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics">
        <canvas id="shot1-gl" class="plate" width="1080" height="1080"></canvas>
      </div>
      <!-- textures: decoded before the timeline is built -->
      <div id="tex" style="display:none">
        <img id="tex-plate" src="assets/demo_hd.jpg" alt="" />
        <img id="tex-depth" src="assets/demo_depth.png" alt="" />
        <img id="tex-water" src="assets/demo_water.png" alt="" />
        <img id="tex-energy" src="assets/demo_energy.png" alt="" />
        <img id="tex-craft" src="assets/craft.png" alt="" />
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const texImgs = Array.from(document.querySelectorAll('#tex img'));
      Promise.all(texImgs.map(i => i.decode().catch(() => null))).then(() => {
        depthShot({
          canvas: 'shot1-gl', plate: 'tex-plate', depth: 'tex-depth', water: 'tex-water', energy: 'tex-energy',
          t0: 0, dur: 6, sub: 6, shutter: 1 / 60, dref: 0.6, flow: [0.0, 1.0], flowAmt: 0.004, timeline: tl,
          // shot spec: push in from wide toward the valley gap, eased; truck a little right; settle with a 2 degree roll
          cam: u => {
            const e = u * u * (3 - 2 * u);
            return { vx: 0.5 + 0.03 * e, vy: 0.52 - 0.02 * e, lz: 0.06 + 0.28 * e, roll: -2 * e, px: 0.012 * e, py: 0, pz: 0.22 * e };
          },
          sprites: [{ img: 'tex-craft', at: (u, t) => ({ x: 0.92 - 0.6 * u, y: 0.30 + 0.04 * u, d: 0.2, size: 0.05, rot: 2, alpha: 1 }) }]
        });
        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
